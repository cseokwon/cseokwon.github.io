<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow, noarchive">

  <title>Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
      background: #fff;
    }

    header {
      height: 100px;
      display: flex;
      align-items: center;
      padding: 0 55px;
      border-bottom: 1px solid #ddd;
    }

    header a {
      text-decoration: none;
      color: #222;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 100px);
    }

    .sidebar {
      width: 260px;
      padding: 55px 35px;
      border-right: 1px solid #ddd;
    }

    .sidebar a {
      display: block;
      text-decoration: none;
      color: #444;
      font-size: 16px;
    }

    .sidebar a:hover {
      color: #000;
      font-weight: 600;
    }

    .main-menu {
      margin-bottom: 30px;
      font-weight: 600;
    }

    .project-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    .sub-menu {
      padding-left: 18px;
    }

    .sub-menu a {
      margin-bottom: 17px;
      font-size: 15px;
      color: #666;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px;
    }

    .intro {
      max-width: 720px;
      width: 100%;
    }

    .intro h2 {
      font-size: 38px;
      margin: 0 0 20px;
      font-weight: 500;
    }

    .intro p {
      font-size: 17px;
      line-height: 1.7;
      color: #444;
    }

    @media (max-width: 750px) {
      header {
        padding: 0 25px;
      }

      .layout {
        display: block;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #ddd;
        padding: 25px;
      }

      main {
        padding: 45px 25px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="/">
    <h1>SEOK-WON CHOI</h1>
  </a>
</header>

<div class="layout">

  <nav class="sidebar">

    <a class="main-menu" href="cv.html">CV</a>

    <div class="project-title">
      Projects Portfolio
    </div>

    <div class="sub-menu">
      <a href="sk-on.html">SK On</a>
      <a href="capstone-design.html">Capstone Design</a>
      <a href="academic-projects.html">Academic Projects</a>
      <a href="training.html">Training</a>
    </div>

  </nav>

  <main>
    <section class="intro">

      <h2>Hello, I'm Seok-won Choi.</h2>

      <p>
        Welcome to my personal project portfolio.
      </p>

    </section>
  </main>

</div>

</body>
</html>
